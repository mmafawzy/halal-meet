# Production-like local stack: API + Postgres + Redis + MinIO (S3-compatible photo storage).
#   docker compose up --build
#   curl http://localhost:3000/health
# Sign-in uses the dev OTP code 000000 here because OTP_PROVIDER=dev and NODE_ENV is not production.
# For a real deployment use managed Postgres/Redis/object storage and the variables in apps/api/.env.example.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: halalmeet
      POSTGRES_PASSWORD: halalmeet
      POSTGRES_DB: halalmeet
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U halalmeet']
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: halalmeet
      MINIO_ROOT_PASSWORD: halalmeet-secret
    ports: ['9001:9001'] # web console
    volumes: [miniodata:/data]
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      retries: 10

  # Creates the private photos bucket once MinIO is up.
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio: { condition: service_healthy }
    entrypoint: >
      sh -c "mc alias set local http://minio:9000 halalmeet halalmeet-secret &&
             mc mb --ignore-existing local/halal-meet-photos &&
             mc anonymous set none local/halal-meet-photos"

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio-init: { condition: service_completed_successfully }
    ports: ['3000:3000']
    environment:
      # Compose runs the image in development mode so the dev OTP code works; set NODE_ENV=production in real deploys.
      NODE_ENV: development
      JWT_SECRET: change-me-local-only
      DATABASE_URL: postgres://halalmeet:halalmeet@postgres:5432/halalmeet
      REDIS_URL: redis://redis:6379
      OTP_PROVIDER: dev
      PHOTO_STORAGE: s3
      S3_BUCKET: halal-meet-photos
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_FORCE_PATH_STYLE: 'true'
      S3_ACCESS_KEY_ID: halalmeet
      S3_SECRET_ACCESS_KEY: halalmeet-secret
      PUBLIC_API_URL: http://localhost:3000

volumes:
  pgdata:
  miniodata:

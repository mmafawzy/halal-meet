name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # Version comes from "packageManager" in package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck (core, api, mobile)
        run: pnpm -r typecheck

      # API e2e tests run against in-memory PGlite, so no database service is needed.
      - name: Test (core, api, mobile)
        run: pnpm -r test

      - name: Build API
        run: pnpm --filter @halal-meet/api build
